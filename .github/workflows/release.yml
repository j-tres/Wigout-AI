name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write
  

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x extension/gradlew

      - name: Build Wigout.bwextension
        working-directory: extension
        run: ./gradlew build

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ASSET="extension/build/extensions/Wigout.bwextension"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating asset instead of creating."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --generate-notes
          fi
